<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Vue Reactivity Pitfalls">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2dc" />
      <stop offset="1" stop-color="#efe8de" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b35" />
      <stop offset="1" stop-color="#ffb347" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="48" fill="url(#bg)" />
  <rect x="70" y="70" width="1060" height="490" rx="36" fill="#ffffff" opacity="0.9" />

  <g transform="translate(110 170)" font-family="Arial, Helvetica, sans-serif">
    <text x="0" y="0" font-size="54" font-weight="700" fill="#1f1f1f">
      Vue Reactivity Pitfalls
    </text>
    <text x="0" y="60" font-size="24" font-weight="400" fill="#676767">
