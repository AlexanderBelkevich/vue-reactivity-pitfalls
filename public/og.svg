        Vue 3 Playground
      </text>
    </g>
  </g>

  <g transform="translate(850 160)">
    <rect width="210" height="210" rx="28" fill="#0d0f12" />
    <path d="M30 60 L105 175 L180 60" fill="none" stroke="url(#accent)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="105" cy="60" r="12" fill="#ffd7b3" />
  </g>

  <g transform="translate(110 520)" font-family="Arial, Helvetica, sans-serif">
    <text x="0" y="0" font-size="22" fill="#1f1f1f">by Alexander Belkevich</text>
    <text x="0" y="28" font-size="18" fill="#676767">vue-reactivity-pitfalls.netlify.app</text>
